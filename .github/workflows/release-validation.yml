name: Validate and build all three platforms

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify generated sources are already synchronised
        run: |
          python scripts/sync_opencode.py
          python scripts/sync_claude.py
          git diff --exit-code -- chatgpt claude opencode shared
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Build all three distributions
        run: python scripts/build.py
      - name: Verify all archive members against source
        run: python scripts/verify_archives.py
      - name: Save validated distributions on release branch
        if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          for platform in ('claude', 'opencode'):
              for archive in (Path('dist')/platform).glob('*.zip'):
                  if not archive.name.endswith(f'-v{version}.zip'):
                      archive.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist
          if ! git diff --cached --quiet; then
            git commit -m "build: validated three-platform distribution archives"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload validated release archives
        uses: actions/upload-artifact@v4
        with:
          name: een-pod-suite-validated
          path: dist/
